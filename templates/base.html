{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="logo">
                 Elimu<strong>Local</strong>
            </a>
            <div class="nav-links">
                {{if .LoggedIn}}
                    <span class="nav-user meta-item"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="5" r="3" stroke="#6b7280" stroke-width="1.2" fill="none"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>{{.CurrentUser.Username}}</span>
                    <a href="/quizzes" class="nav-link">Quizzes</a>
                    <a href="/quiz/create" class="nav-btn">Create Quiz</a>
                    <a href="/upload" class="nav-btn">+ Share resources</a>
                    <a href="/logout" class="nav-logout">Log out</a>
                {{else}}
                    <a href="/quizzes" class="nav-link">Quizzes</a>
                    <a href="/login" class="nav-link">Log in</a>
                    <a href="/register" class="nav-btn">Register</a>
                {{end}}
            </div>
        </div>
    </nav>

    <main>
        {{template "content" .}}
    </main>

     <footer>
         <p> Built for Kenyan university students — ElimuLocal 2026</p>
     </footer>

</body>
</html>
{{end}}
